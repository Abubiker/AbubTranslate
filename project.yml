name: AbubTranslate
options:
  bundleIdPrefix: com.opensource
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
knownRegions:
  - en
  - ru
  - Base

targets:
  AbubTranslate:
    type: application
    platform: macOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AbubTranslate
        LSUIElement: true
        NSHumanReadableCopyright: MIT License
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.opensource.abubtranslate
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: true
    GENERATE_INFOPLIST_FILE: false
